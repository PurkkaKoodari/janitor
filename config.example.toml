# Telegram bot token.
bot_token = "FILLME"

# Database file name (SQLite).
db_name = "janitor.db"

# Users allowed to add the bot to groups and delete anything from the channel.
# admins[0] is a super admin that can assign new admins and gets some service messages and error reports.
admins = [123456789]

# User name mentioned when unknown users message the bot: "please talk to {admin_name}".
admin_name = "your mom"

[chats]
# Chats used to update the channel (also implies moderated).
source = [-1001234567890]

# Channel where messages from source are forwarded.
channel = 0

# Chats that the bot moderates but doesn't forward to the channel.
moderated = [-1001234567890]

# Channel where messages deleted by the bot are forwarded for monitoring.
monitor = -1001234567890

[spam]
# Hardcoded regex patterns that indicate spam.
# If any pattern matches, the message is considered spam without consulting the AI.
regex = ["spammy phrase 1"]

# Treat forwarded stories from other users as spam (their contents are not visible via the API).
# Users sharing their own story are not affected.
forwarded_story = true

# Treat messages forwarded from a channel that contain an inline keyboard as spam.
channel_forwarded_with_keyboard = true

# Treat messages forwarded from a channel that contain both Cyrillic text and a
# suspicious link (matched by suspicious_link_regex) as spam.
channel_forwarded_cyrillic_and_links = true

# Link pattern used by the channel_forwarded_cyrillic_and_links check.
suspicious_link_regex = '@\w+|https?://t\.me|https?://vk\.'

[llm]
# OpenRouter API key and model name for spam detection.
openrouter_key = "FILLME"
model = "openai/gpt-oss-20b"
# Temperature for the LLM. Lower values make the output more consistent.
temperature = 0.5

# Timeout in seconds for the LLM API call. Timeouts cause a retry.
timeout = 15.0
# Retry delay in seconds after a timeout or other error when calling the LLM API.
retry_delay = 1.0
# Number of times to retry the LLM API call after a timeout or other error.
# If all retries fail, the message is not considered spam.
retry_count = 3

# Minimum message length (characters) required before consulting the AI.
# Shorter messages skip the LLM call and are assumed not to be spam.
min_length = 20

# System prompt for the AI-based spam detection.
# {purpose} will be replaced with the chat's purpose from the [purposes] section.
# The AI should output a probability between 0.0 and 1.0 that the message is spam.
system_prompt = """You are a moderator for a chat group where {purpose}. Your task is to determine whether the user's message is spam. {media}

Almost always spam:
- Remote job offers with few details and high pay
- Investment and cryptocurrency promotion
- Online casinos
- Pornography
- Similar typical spam

Likely not spam:
- Messages related to the group's purpose
- People selling items
- Offering free items or apartment leases
- Normal everyday questions
- Student projects, including surveys

Potentially spam, evaluate carefully:
- Referring people to another Telegram group or channel (may be done with good intent if the group/channel does not seem like spam)
- Job offers suitable for students
- Honest discussion of investments
- Writing in languages other than English or Finnish

Output a probability between 0.0 and 1.0 that the message is spam."""

# Threshold above which messages are considered spam and deleted.
threshold = 0.9

# Map chat IDs (as strings) to a description of each chat's purpose.
# The default key is used as the fallback.
[llm.chat_purposes]
default = "people post cool messages"
"-1001234567890" = "people post cool messages"

[channel_ignore]
# Duration for the next two settings.
recent_seconds = 900 # 15 min

# Minimum message length to consider "useful" from users that haven't sent useful messages in recent_seconds.
length_min_from_silent = 15

# Minimum message length to consider "useful" from users that have sent ignored messages in recent_seconds.
length_min_from_ignored = 20

# channel_ignore.rules: messages matching any rule are not forwarded to the channel.
# Fields:
#   regex  – case-insensitive pattern
#   media  – omit (don't care) | true (must have media) | false (must not have media)
#   delete – if true, forwarded copies are deleted when a message is edited to match this rule
[[channel_ignore.rules]]
regex = "example"
