[project]
name = "janitorbot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "openrouter>=0.9.1",
    "pydantic>=2.13.4",
    "python-telegram-bot>=22.8",
]

[tool.setuptools]
py-modules = []

[tool.black]
line-length = 100
target-version = ["py313"]

[dependency-groups]
dev = [
    "black>=26.5.1",
    "isort>=8.0.1",
]
